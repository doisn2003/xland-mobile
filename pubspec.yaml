name: xland_mobile
description: XLand mobile foundation (Phase 1)
publish_to: none
version: 0.1.0+1
environment:
  sdk: '>=3.13.4 <4.0.0'
  flutter: '>=3.47.5'
dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: 9.1.1
  bloc: 9.0.0
  intl: 0.20.2
  http: 1.6.0
  flutter_secure_storage: 11.2.0
  video_player: 2.11.1
dev_dependencies:
  crypto: 3.0.7
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
# Binary fonts are declared once B provides files and a license manifest.
