name: xland_mobile
description: XLand mobile internal pilot
publish_to: none
version: 0.2.5+8
environment:
  sdk: '>=3.13.4 <4.0.0'
  flutter: '>=3.47.5'
dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: 9.1.1
  bloc: 9.0.0
  intl: 0.20.2
  http: 1.6.0
  flutter_secure_storage: 11.2.0
  video_player: 2.11.1
  google_sign_in: 7.2.0
  webview_flutter: 4.14.1
  web: 1.1.1
  flutter_map: 8.3.2
  latlong2: 0.9.1
  url_launcher: 6.3.3
  # Keep the pinned player in the workspace: Android Studio must not depend on
  # the external Pub Cache entry that failed to resolve in the IDE build.
  lottie:
    path: third_party/lottie
  share_plus:
    path: third_party/share_plus
dependency_overrides:
  # Pinned unchanged sources keep new sharing dependencies visible to the IDE,
  # matching the existing workspace-local Lottie setup.
  share_plus_platform_interface:
    path: third_party/share_plus_platform_interface
  cross_file:
    path: third_party/cross_file
  mime:
    path: third_party/mime
dev_dependencies:
  crypto: 3.0.7
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/branding/
    - assets/images/
    - assets/images/report/
    - assets/icons/
    - assets/animations/xland-nft.json
    - assets/animations/xland-nft-poster.png
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
          weight: 400
        - asset: assets/fonts/Roboto-Medium.ttf
          weight: 500
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700
