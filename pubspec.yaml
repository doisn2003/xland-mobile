name: xland_mobile
description: XLand mobile internal pilot
publish_to: none
version: 0.1.0+1
environment:
  sdk: '>=3.13.4 <4.0.0'
  flutter: '>=3.47.5'
dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: 9.1.1
  bloc: 9.0.0
  intl: 0.20.2
  http: 1.6.0
  flutter_secure_storage: 11.2.0
  video_player: 2.11.1
  google_sign_in: 7.2.0
  webview_flutter: 4.14.1
  web: 1.1.1
  flutter_map: 8.3.2
  latlong2: 0.9.1
  url_launcher: 6.3.3
dev_dependencies:
  crypto: 3.0.7
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/report/
    - assets/icons/
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
          weight: 400
        - asset: assets/fonts/Roboto-Medium.ttf
          weight: 500
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700
